<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FF Navigation Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: #1e1e1e;
      border: 2px solid #ff4655;
      border-radius: 12px;
      padding: 30px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 20px rgba(255, 70, 85, 0.25);
    }

    h2 {
      color: #ff4655;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    p {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .ff-btn {
      padding: 14px 20px;
      font-size: 16px;
      font-weight: bold;
      text-transform: uppercase;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-red {
      background-color: #ff4655;
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(255, 70, 85, 0.4);
    }

    .btn-red:hover {
      background-color: #e03e4d;
      transform: translateY(-2px);
    }

    .btn-gold {
      background-color: #ffb400;
      color: #121212;
      box-shadow: 0 4px 10px rgba(255, 180, 0, 0.3);
    }

    .btn-gold:hover {
      background-color: #e09e00;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>FF Portal</h2>
    <p>Select an option to redirect</p>

    <div class="btn-container">
      <button class="ff-btn btn-gold" onclick="goToPage('https://shengcaier2010.github.io/FF-BIO-CODE/')">
        FREE FIRE BIO CREATER
      </button>

      <button class="ff-btn btn-gold" onclick="goToPage('https://shengcaier2010.github.io/FF-caractor-ability/')">
        CARACTOR ABILITY
      </button>

    </div>
  </div>

  <script>
    function goToPage(pageUrl) {
      window.location.href = pageUrl;
    }
  </script>

</body>
</html>
